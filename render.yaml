services:
  - type: web
    name: draw-control
    runtime: node
    plan: free
    buildCommand: npm install && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://draw-control.onrender.com

databases:
  - name: lottery-db
    plan: free
    databaseName: lottery
    user: lottery_user
